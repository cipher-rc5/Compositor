# The hosted copy of the local CI gate. Both run scripts/ci.sh — a clean, warning-free build of the app and
# test targets followed by the unit tests — so a push that passes `just ci` locally passes here, and the
# reverse. The UI tests stay out, as they do locally: they need a logged-in desktop and Accessibility access.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request supersedes the run in progress. Runs on main are never cancelled,
# so every commit there gets a result (scripts/publish.sh checks for one before releasing).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: ci (Xcode ${{ matrix.xcode }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # The deployment target is macOS 26.5, so the build needs the macOS 26.5 SDK or newer (Xcode 26.5+),
          # and the unit tests run on the runner itself, so its OS must be 26.5 or later too.
          #
          # macos-26 is GitHub's generally available arm64 image (macOS 26.6). Its Xcode 26.6 carries the
          # macOS 26.5 SDK and matches the project's LastUpgradeCheck (2660). It is the oldest toolchain the
          # README promises to build with, so it catches anything that only compiles on newer Xcode.
          - runner: macos-26
            xcode: '26.6'
          # xcode-27 is GitHub's Xcode 27 image (macOS 27), still labelled a preview. Xcode 27.0 is what
          # maintainers build and release with locally, so this leg matches the shipped binary's toolchain.
          # If the preview image's queueing becomes a problem, drop this leg rather than the one above.
          - runner: xcode-27
            xcode: '27.0'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode ${{ matrix.xcode }}
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ matrix.xcode }}

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun swift --version

      # Fails if Package.resolved is missing a dependency or would have to change, instead of quietly
      # building against a newer Sparkle than the one the release pins.
      - name: Resolve Swift packages from Package.resolved
        run: >
          xcodebuild -resolvePackageDependencies
          -project Compositor.xcodeproj
          -scheme Compositor
          -derivedDataPath build/ci
          -onlyUsePackageVersionsFromResolvedFile

      - name: Run the CI gate (scripts/ci.sh)
        run: ./scripts/ci.sh

      - name: Upload test results and logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-xcode-${{ matrix.xcode }}
          path: |
            build/ci/tests.xcresult
            build/ci/build.log
            build/ci/test.log
          retention-days: 14
          if-no-files-found: ignore

  # Checks the dependencies a pull request adds or changes (Sparkle in Package.resolved, and the actions these
  # workflows pin) against GitHub's advisory database, and fails on a known vulnerability of moderate severity
  # or worse. Needs the repository's dependency graph, which is on by default for public repositories.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
