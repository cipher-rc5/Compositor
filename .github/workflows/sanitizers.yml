# The unit tests under Address Sanitizer and Undefined Behavior Sanitizer (scripts/test-sanitized.sh, or
# `just test-sanitized` locally). They exist for the C pixel kernels in Compositor/Rendering/*.c, which
# index raw RGBA buffers by hand. A sanitized run is several times slower than the normal gate, so it runs
# weekly, on demand, and on pull requests that touch the C sources — not on every push.
name: Sanitizers

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays, 06:17 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - 'Compositor/**/*.c'
      - 'Compositor/**/*.h'
      - 'scripts/test-sanitized.sh'
      - '.github/workflows/sanitizers.yml'

permissions:
  contents: read

concurrency:
  group: sanitizers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  asan-ubsan:
    name: ASan + UBSan unit tests
    # The generally available image and Xcode; see ci.yml for why these satisfy the macOS 26.5 target.
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 26.6
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.6'

      - name: Resolve Swift packages from Package.resolved
        run: >
          xcodebuild -resolvePackageDependencies
          -project Compositor.xcodeproj
          -scheme Compositor
          -derivedDataPath build/sanitize
          -onlyUsePackageVersionsFromResolvedFile

      - name: Run the sanitized unit tests
        run: ./scripts/test-sanitized.sh

      - name: Upload test results and log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sanitizers
          path: |
            build/sanitize/tests.xcresult
            build/sanitize/test.log
          retention-days: 14
          if-no-files-found: ignore
